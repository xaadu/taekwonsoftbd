services:
    taekwonsoftbd_proxy:
        image: nginx:1.27.5-alpine
        command: "nginx -g 'daemon off;'"
        build: !reset null
        volumes: !override
            - ./proxy/templates:/etc/nginx/templates
            - assets:/assets
        ports: !reset []
        networks:
            - taekwonsoftbd_network
            - pm_public

networks:
    pm_public:
        external: true
