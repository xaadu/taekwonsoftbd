services:
  taekwonsoftbd_db:
    container_name: db_container
    image: postgres:13.2-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - 33066:5432
  taekwonsoftbd_app:
    container_name: app_container
    restart: unless-stopped
    env_file:
      - .env
    build:
      context: ./app
      dockerfile: Dockerfile
    volumes:
      - ./app:/app
    ports:
      - 8000:8000
    depends_on:
      - taekwonsoftbd_db

volumes:
  dbdata:
